<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f3f6fa;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }

    .form-container {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgb(15 23 42 / 7%);
    }

    h1 {
      margin: 0 0 8px;
      color: #173b66;
      font-size: 1.8rem;
    }

    .intro {
      margin: 0 0 28px;
      color: #64748b;
      line-height: 1.5;
    }

    fieldset {
      min-width: 0;
      margin: 0 0 24px;
      padding: 22px;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
    }

    legend {
      padding: 0 8px;
      color: #173b66;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field label,
    .gender-group > span {
      display: block;
      margin-bottom: 7px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #1f2937;
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      outline: 3px solid rgb(37 99 235 / 15%);
    }

    .gender-options {
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 20px;
    }

    .gender-options label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-weight: 400;
    }

    .gender-options input {
      width: auto;
      min-height: auto;
      accent-color: #1d4ed8;
    }

    button {
      min-height: 46px;
      padding: 0 24px;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 10px;
      }

      .form-container {
        padding: 22px 16px;
      }

      fieldset {
        padding: 18px 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="form-container">
    <h1>Student Registration</h1>
    <p class="intro">Complete the form below to submit your student information.</p>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>
        <div class="form-grid">
          <div class="field">
            <label for="registration-number">Registration Number</label>
            <input id="registration-number" name="registrationNumber" type="text"
                   placeholder="Enter your registration number" required>
          </div>

          <div class="field">
            <label for="first-name">First Name</label>
            <input id="first-name" name="firstName" type="text"
                   placeholder="Enter your first name" autocomplete="given-name" required>
          </div>

          <div class="field">
            <label for="last-name">Last Name</label>
            <input id="last-name" name="lastName" type="text"
                   placeholder="Enter your last name" autocomplete="family-name" required>
          </div>

          <div class="field gender-group">
            <span>Gender</span>
            <div class="gender-options">
              <label><input type="radio" name="gender" value="female" required> Female</label>
              <label><input type="radio" name="gender" value="male"> Male</label>
              <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
          </div>

          <div class="field">
            <label for="residence">Residence</label>
            <input id="residence" name="residence" type="text"
                   placeholder="Enter your residence">
          </div>

          <div class="field">
            <label for="religion">Religion</label>
            <input id="religion" name="religion" type="text"
                   placeholder="Enter your religion">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contact Details</legend>
        <div class="form-grid">
          <div class="field">
            <label for="contact">Contact (Phone)</label>
            <input id="contact" name="contact" type="tel"
                   placeholder="e.g., +1 555 123 4567" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Academic Details</legend>
        <div class="form-grid">
          <div class="field">
            <label for="course">Course / Program</label>
            <input id="course" name="course" type="text"
                   placeholder="Enter your course or program" required>
          </div>

          <div class="field">
            <label for="session">Session</label>
            <select id="session" name="session" required>
              <option value="" disabled selected>Select a session</option>
              <option value="morning">Morning</option>
              <option value="afternoon">Afternoon</option>
              <option value="evening">Evening</option>
              <option value="weekend">Weekend</option>
            </select>
          </div>

          <div class="field">
            <label for="year-of-study">Year of Study</label>
            <select id="year-of-study" name="yearOfStudy" required>
              <option value="" disabled selected>Select year of study</option>
              <option value="1">Year 1</option>
              <option value="2">Year 2</option>
              <option value="3">Year 3</option>
              <option value="4">Year 4</option>
              <option value="5">Year 5</option>
            </select>
          </div>

          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
              <option value="" disabled selected>Select a semester</option>
              <option value="1">Semester 1</option>
              <option value="2">Semester 2</option>
              <option value="3">Semester 3</option>
            </select>
          </div>

          <div class="field">
            <label for="academic-year">Academic Year</label>
            <input id="academic-year" name="academicYear" type="text"
                   placeholder="e.g., 2026–2027" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Guardian Information</legend>
        <div class="form-grid">
          <div class="field">
            <label for="guardian-name">Guardian Name</label>
            <input id="guardian-name" name="guardianName" type="text"
                   placeholder="Enter guardian's full name" required>
          </div>

          <div class="field">
            <label for="guardian-telephone">Guardian Telephone</label>
            <input id="guardian-telephone" name="guardianTelephone" type="tel"
                   placeholder="Enter guardian's phone number" required>
          </div>

          <div class="field">
            <label for="guardian-location">Guardian Location</label>
            <input id="guardian-location" name="guardianLocation" type="text"
                   placeholder="Enter guardian's location" required>
          </div>
        </div>
      </fieldset>

      <button type="submit">Submit Registration</button>
    </form>
  </main>
</body>
</html>
